name: Deploy

on:
  push:
    branches: [custom]
  workflow_dispatch:

# 同時に2つデプロイしない。実行中のデプロイは途中で止めず、後続を待たせる
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # イメージはCIでビルドしてGHCRに置き、サーバはpullするだけにする
  build:
    needs: ci
    # 手動実行(workflow_dispatch)で別のブランチを選んでも、:custom のイメージを上書きさせない
    if: github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 形態素解析はSudachiだけを使うので、MeCab(NEologd)は入れない(イメージを小さく、ビルドを速くするため)。
      # サーバはrevisionのラベルで、pullしたイメージがこのコミットのものかを確かめる
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            enable_mecab=0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:custom
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_SSH_HOST }}

      # Tailscale SSHを使うので、SSH鍵やknown_hostsの管理は不要
      - name: Deploy over Tailscale SSH
        run: |
          tailscale ssh "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "$IMAGE" < scripts/deploy.sh
